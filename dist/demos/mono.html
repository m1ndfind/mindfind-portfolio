</style><header><b>MONO COFFEE</b><span>ДЕМО / 2026</span></header><main><div class="shape"></div><h1>Город подождёт. Кофе — нет.</h1><p>Небольшая пауза для большого дня. Выберите напиток под настроение.</p><button id="explore" aria-controls="options" aria-expanded="false">Посмотреть меню</button></main><div id="options"><span>Эспрессо · 180 ₽</span><span>Капучино · 260 ₽</span><span>Матча · 290 ₽</span></div><footer>Учебная концепция Mindfind. Цены и предложение демонстрационные.</footer><script>document.getElementById('explore').onclick=function(){const o=document.getElementById('options');const open=o.style.display==='flex';o.style.display=open?'none':'flex';this.setAttribute('aria-expanded',String(!open));if(!open)o.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'})};document.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'mindfind:close-demo'},'*')})</script></html>
